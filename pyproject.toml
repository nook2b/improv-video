[project]
name = "improv-video"
version = "0.1.10"
description = "Insta360 Ace Pro 2 → YouTube: автоматическая склейка и загрузка роликов"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
