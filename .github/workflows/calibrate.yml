name: calibrate

# Запуск: записать ID файла Google Drive (доступ по ссылке) в calibration/drive_id.txt и запушить.
on:
  push:
    paths: ["calibration/drive_id.txt", "tools/calibrate.py", ".github/workflows/calibrate.yml"]

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Скачать клип с Google Drive
        run: |
          ID=$(tr -d '[:space:]' < calibration/drive_id.txt)
          curl -sSL -o clip.mp4 "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"
          ls -la clip.mp4
          file clip.mp4
      - name: Калибровка
        run: python tools/calibrate.py clip.mp4 calibration/AcePro2_I-Log_To_Rec.709_V1.0.cube out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration
          path: |
            out/*.png
            out/preview.mp4
